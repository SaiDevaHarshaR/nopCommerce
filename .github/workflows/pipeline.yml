name: Pipeline for NOPCommerce

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore src/Presentation/Nop.Web/Nop.Web.csproj

      - name: Build project
        run: dotnet build src/Presentation/Nop.Web/Nop.Web.csproj --configuration Release --no-restore

      - name: Publish project
        run: dotnet publish src/Presentation/Nop.Web/Nop.Web.csproj --configuration Release --no-build -o ./publish

      - name: Run tests
        run: dotnet test src/Presentation/Nop.Web/Nop.Web.csproj --logger "trx;LogFileName=test-results.trx" --no-build

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: src/Presentation/nop.web/TestResults/test-results.trx

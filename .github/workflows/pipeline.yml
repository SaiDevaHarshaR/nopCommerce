---
name: pipeline for NOPCommerce
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - name: Restoring dependencies
        run: dotnet restore src/Presentation/nop.web/nop.web.csproj
      - run: dotnet build src/Presentation/nop.web/nop.web.csproj --configuration Release
      - run: dotnent publish --configuration release src/Presentation/nop.web/nop.web.csproj
      - run: dotnet test src/Presentation/nop.web/nop.web.csproj --logger "trx;LogFileName=test-results.trx"
      - name: to upload test results in artifact
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: src/Tests/nop.tests/nop.tests.csproj